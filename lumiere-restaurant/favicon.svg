<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Dark background -->
  <rect width="64" height="64" fill="#0a0a0a" rx="6"/>

  <!-- Outer gold border ring -->
  <rect x="2.5" y="2.5" width="59" height="59" fill="none" stroke="#C6A769" stroke-width="0.8" rx="4" opacity="0.55"/>

  <!-- Large serif L — dominant, centered -->
  <text x="33" y="57"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="42"
        font-weight="400"
        fill="#C6A769"
        text-anchor="middle">L</text>

  <!-- Flame — shifted left, taller, wider, more organic flame shape -->
  <!-- Base glow -->
  <ellipse cx="30" cy="18" rx="4" ry="2" fill="#C6A769" opacity="0.25"/>

  <!-- Outer flame — tall organic teardrop with lean -->
  <path d="M30 18
           C28 15 25.5 12 26.5 8
           C24.5 10 24 13 25.5 15.5
           C23 12 23.5 8 26 5.5
           C24 7.5 23 10.5 24 13.5
           C22.5 10 23 6.5 25.5 4
           C23.5 6 23 9.5 25 12
           C24 9 25 6 27.5 4.5
           C26 7 26 10 27.5 13
           C27 10 28 7.5 30 6
           C32 7.5 33 10 32.5 13
           C34 10 34 7 32.5 4.5
           C35 6 36 9 35 12
           C37 9.5 36.5 6 34.5 4
           C37 6.5 37.5 10 36 13.5
           C37 10.5 36 7.5 34 5.5
           C36.5 8 37 12 34.5 15.5
           C36 13 35.5 10 33.5 8
           C34.5 12 32 15 30 18Z"
        fill="#C6A769" opacity="0.92"/>

  <!-- Middle flame layer — slightly lighter -->
  <path d="M30 17
           C28.5 14.5 27 11.5 27.5 8.5
           C26 10.5 26 13 27.5 15
           C26 12 26.5 9 28.5 7
           C27 9.5 27 12 28.5 14
           C28 11.5 29 9 30.5 8
           C32 9 33 11.5 32.5 14
           C34 12 34 9.5 32.5 7
           C34.5 9 35 12 33.5 15
           C35 13 35 10.5 33.5 8.5
           C34 11.5 32.5 14.5 30 17Z"
        fill="#D4B87A" opacity="0.75"/>

  <!-- Inner hot core — bright -->
  <path d="M30 15.5
           C29 13.5 28.5 11 29.5 9
           C29 10.5 29.2 12.5 30 14
           C30.8 12.5 31 10.5 30.5 9
           C31.5 11 31 13.5 30 15.5Z"
        fill="#E8D5A3" opacity="0.9"/>

  <!-- Wick connecting flame to top of L -->
  <rect x="29.3" y="17.5" width="1.4" height="2.5" fill="#C6A769" rx="0.7" opacity="0.65"/>

  <!-- Corner diamond accents -->
  <rect x="10.5" y="10.5" width="3" height="3" fill="#C6A769" transform="rotate(45 12 12)" opacity="0.35"/>
  <rect x="49.5" y="10.5" width="3" height="3" fill="#C6A769" transform="rotate(45 51 12)" opacity="0.35"/>
  <rect x="10.5" y="49.5" width="3" height="3" fill="#C6A769" transform="rotate(45 12 51)" opacity="0.35"/>
  <rect x="49.5" y="49.5" width="3" height="3" fill="#C6A769" transform="rotate(45 51 51)" opacity="0.35"/>
</svg>
