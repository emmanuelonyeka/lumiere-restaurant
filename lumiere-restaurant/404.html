<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | Lumière Fine Dining</title>
    <meta name="robots" content="noindex, nofollow">

    <!-- Favicon -->
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="favicon.svg">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- Main CSS -->
    <link rel="stylesheet" href="style.css">

    <style>
        /* ========================================
           404 PAGE — LUXURY STYLES
           ======================================== */

        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        .error-page {
            position: relative;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--color-bg-primary);
            overflow: hidden;
            text-align: center;
            padding: var(--space-8);
        }

        /* Background image with dark veil */
        .error-bg {
            position: absolute;
            inset: 0;
            z-index: 0;
        }

        .error-bg img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.18) saturate(0.6);
            transform: scale(1.05);
        }

        /* Radial gold glow at centre */
        .error-glow {
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at 50% 55%, rgba(198, 167, 105, 0.09) 0%, transparent 65%);
            z-index: 1;
            pointer-events: none;
        }

        /* Decorative rotating ring */
        .error-ring {
            position: absolute;
            width: min(60vw, 560px);
            height: min(60vw, 560px);
            border: 1px solid rgba(198, 167, 105, 0.12);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: ringRotate 40s linear infinite;
            z-index: 1;
        }

        .error-ring::before {
            content: '';
            position: absolute;
            width: min(78vw, 720px);
            height: min(78vw, 720px);
            border: 1px solid rgba(198, 167, 105, 0.07);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: ringRotate 60s linear infinite reverse;
        }

        @keyframes ringRotate {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to   { transform: translate(-50%, -50%) rotate(360deg); }
        }

        /* Content */
        .error-content {
            position: relative;
            z-index: 2;
            max-width: 640px;
        }

        /* "404" numeral */
        .error-numeral {
            font-family: var(--font-serif);
            font-size: clamp(7rem, 22vw, 13rem);
            font-weight: 300;
            letter-spacing: 0.15em;
            color: transparent;
            -webkit-text-stroke: 1px rgba(198, 167, 105, 0.45);
            line-height: 1;
            margin: 0;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.2s;
            user-select: none;
        }

        /* Gold divider */
        .error-divider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-5);
            margin: var(--space-6) 0;
            opacity: 0;
            animation: fadeIn 0.8s ease forwards 0.6s;
        }

        .error-divider-line {
            width: 50px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--color-gold));
        }

        .error-divider-line:last-child {
            background: linear-gradient(90deg, var(--color-gold), transparent);
        }

        .error-divider-diamond {
            width: 5px;
            height: 5px;
            background: var(--color-gold);
            transform: rotate(45deg);
            flex-shrink: 0;
        }

        /* Label above title */
        .error-label {
            display: block;
            font-family: var(--font-sans);
            font-size: var(--text-xs);
            font-weight: 500;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: var(--color-gold);
            margin-bottom: var(--space-4);
            opacity: 0;
            animation: fadeIn 0.8s ease forwards 0.8s;
        }

        /* Main heading */
        .error-title {
            font-family: var(--font-serif);
            font-size: clamp(var(--text-2xl), 5vw, var(--text-4xl));
            font-weight: 300;
            letter-spacing: 0.1em;
            color: var(--color-text-primary);
            margin: 0 0 var(--space-5) 0;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.9s;
        }

        /* Sub-text */
        .error-text {
            font-family: var(--font-serif);
            font-size: clamp(var(--text-base), 2vw, var(--text-lg));
            font-weight: 300;
            font-style: italic;
            color: var(--color-text-tertiary);
            line-height: 1.75;
            margin: 0 0 var(--space-12) 0;
            opacity: 0;
            animation: fadeIn 0.9s ease forwards 1.1s;
        }

        /* CTA group */
        .error-actions {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: var(--space-4);
            opacity: 0;
            transform: translateY(20px);
            animation: fadeUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards 1.3s;
        }

        /* Primary button — reuses .magnetic-btn look */
        .error-btn-primary {
            display: inline-flex;
            align-items: center;
            gap: var(--space-3);
            padding: var(--space-4) var(--space-8);
            background: var(--color-gold);
            color: var(--color-bg-primary);
            font-family: var(--font-sans);
            font-size: var(--text-xs);
            font-weight: 600;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            border-radius: var(--radius-sm);
            transition: background 0.3s ease, transform 0.3s ease, box-shadow 0.3s ease;
            text-decoration: none;
        }

        .error-btn-primary:hover {
            background: var(--color-gold-light, #d4b87a);
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(198, 167, 105, 0.3);
        }

        /* Ghost button */
        .error-btn-ghost {
            display: inline-flex;
            align-items: center;
            gap: var(--space-3);
            padding: var(--space-4) var(--space-7);
            background: transparent;
            color: var(--color-text-secondary);
            font-family: var(--font-sans);
            font-size: var(--text-xs);
            font-weight: 500;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            transition: border-color 0.3s ease, color 0.3s ease, transform 0.3s ease;
            text-decoration: none;
        }

        .error-btn-ghost:hover {
            border-color: var(--color-gold);
            color: var(--color-gold);
            transform: translateY(-2px);
        }

        .error-btn-primary svg,
        .error-btn-ghost svg {
            width: 14px;
            height: 14px;
            flex-shrink: 0;
        }

        /* Branding at bottom */
        .error-brand {
            position: absolute;
            bottom: var(--space-8);
            left: 50%;
            transform: translateX(-50%);
            z-index: 2;
            opacity: 0;
            animation: fadeIn 1s ease forwards 1.6s;
            white-space: nowrap;
        }

        .error-brand-name {
            font-family: var(--font-serif);
            font-size: var(--text-sm);
            font-weight: 300;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            color: var(--color-text-muted);
        }

        .error-brand-tagline {
            display: block;
            font-family: var(--font-serif);
            font-size: var(--text-xs);
            font-style: italic;
            color: rgba(198, 167, 105, 0.45);
            letter-spacing: 0.1em;
            margin-top: var(--space-1);
        }

        @keyframes fadeUp {
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        /* Reduced motion */
        @media (prefers-reduced-motion: reduce) {
            .error-ring,
            .error-ring::before { animation: none; }
        }

        /* Mobile adjustments */
        @media (max-width: 480px) {
            .error-actions {
                flex-direction: column;
                align-items: stretch;
                width: 100%;
                max-width: 280px;
                margin: 0 auto;
            }

            .error-btn-primary,
            .error-btn-ghost {
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <!-- Page Loader (same as main site) -->
    <div class="page-loader" id="pageLoader">
        <div class="loader-logo">
            <span>L</span><span>U</span><span>M</span><span>I</span><span>È</span><span>R</span><span>E</span>
        </div>
        <div class="loader-line"></div>
    </div>

    <main class="error-page">

        <!-- Dimmed background photo -->
        <div class="error-bg">
            <img src="images/hero-bg.jpg" alt="">
        </div>

        <!-- Radial centre glow -->
        <div class="error-glow"></div>

        <!-- Decorative concentric rings -->
        <div class="error-ring"></div>

        <!-- Content -->
        <div class="error-content">

            <!-- Large ghost numeral -->
            <p class="error-numeral" aria-hidden="true">404</p>

            <!-- Gold divider -->
            <div class="error-divider" aria-hidden="true">
                <span class="error-divider-line"></span>
                <span class="error-divider-diamond"></span>
                <span class="error-divider-line"></span>
            </div>

            <span class="error-label">Page Not Found</span>

            <h1 class="error-title">This Table Has Been Reserved</h1>

            <p class="error-text">
                The page you're looking for seems to have slipped away,<br>
                like a perfectly timed soufflé. Let us guide you back.
            </p>

            <div class="error-actions">
                <a href="index.html" class="error-btn-primary">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                        <polyline points="9 22 9 12 15 12 15 22"/>
                    </svg>
                    <span>Return Home</span>
                </a>

                <a href="reservation.html" class="error-btn-ghost">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                        <line x1="16" y1="2" x2="16" y2="6"/>
                        <line x1="8" y1="2" x2="8" y2="6"/>
                        <line x1="3" y1="10" x2="21" y2="10"/>
                    </svg>
                    <span>Reserve a Table</span>
                </a>
            </div>
        </div>

        <!-- Footer branding -->
        <div class="error-brand">
            <span class="error-brand-name">Lumière</span>
            <span class="error-brand-tagline">Where Culinary Art Meets Timeless Elegance</span>
        </div>

    </main>

    <script>
        // Hide the loader after a brief moment
        window.addEventListener('load', () => {
            setTimeout(() => {
                const loader = document.getElementById('pageLoader');
                if (loader) loader.classList.add('hidden');
                document.body.style.overflow = '';
            }, 1200);
        });
        document.body.style.overflow = 'hidden';
    </script>

</body>
</html>
